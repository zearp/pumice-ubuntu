# keyd config - remaps happen at the kernel evdev layer, before X11/Wayland
# ever sees the keypress, so bindings here apply identically across every
# app/session type. see keyd(1) and https://github.com/rvaiya/keyd
#
# this is intentionally a no-op starting point: [ids] matches every keyboard
# but [main] has no bindings yet, so enabling the service (see
# /usr/local/sbin/pumice_keyd_enable) changes nothing until you add some.
#
# a couple of common starter examples, left commented out:
#
#   capslock = overload(control, esc)   # tap = Escape, hold = Ctrl
#   leftalt = leftmeta
#   leftmeta = leftalt
#
# reload after editing with: sudo keyd reload
#
[ids]
*

[main]
